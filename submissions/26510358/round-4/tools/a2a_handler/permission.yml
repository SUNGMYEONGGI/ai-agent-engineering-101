name: a2a_handler
description: 실재고·손절 승인·정산을 검증하고 결제서 발급 시 가게 지갑 주소를 안내하며 누락 품목을 기록합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, customer_replies.jsonl, holds.json, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 17
replaces: a2a_handler@16
