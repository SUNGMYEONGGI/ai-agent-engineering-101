name: a2a_handler
description: 한국어 고객 A2A 메시지에 응답하고 예약 재고를 판매합니다. reservation_id가 있으면 reservations.jsonl의 유효한 예약을 확인해 checkout_jwt를 만들며, payment mandates와 tx_hash가 오면 clearing /api/settle에 정산합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/catalog.json, public/reservations.jsonl, customers.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 1
