name: a2a_handler
description: 실시간 재고와 진열 가격으로 서명된 결제서를 발급하고 mandate를 정산하며 고객·부족 품목을 기록합니다.
permission:
  network: [market.ourolabs.ai, 127.0.0.1]
  write: [holds.json, customers.jsonl, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 35
replaces: a2a_handler@34
