name: a2a_handler
description: 실재고 기반 품목별 서명 결제서·정산, 누락 기록과 중간가 이하 대안, 실제 응답 기록. 제철 채소 요청은 시금치·콩나물도 확인합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, customer_replies.jsonl, holds.json, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 14
replaces: a2a_handler@13
