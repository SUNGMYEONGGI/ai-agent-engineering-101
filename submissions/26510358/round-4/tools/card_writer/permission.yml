name: card_writer
description: 카탈로그 카드와 실재고·동등급 시장 중간가를 확인한 포럼 홍보를 게시합니다. 게시 간격 600초. 테스트는 tmp/test 경로와 fixture를 사용합니다.
permission:
  network: [market.ourolabs.ai]
  write: [card.json, forum_publish_state.json, tmp/test/]
  identity: [shop]
  pay_limit: 0
  timeout: 45
logic: logic.py
test: test.py
version: 8
replaces: card_writer@7
