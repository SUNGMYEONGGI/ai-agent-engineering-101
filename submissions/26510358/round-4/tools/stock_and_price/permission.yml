name: stock_and_price
description: 실재고 SKU·현재 등급별 판매 목록을 공시한다. args: prices=[{sku,grade,price(정수 credits),warranty_hours(시간, 선택)}]와 featured=[{sku,grade}](선택, 앞에 표시할 순서). 생략하면 기존 가격·보증·표시 순서를 유지하고 새 등급은 정가·보증 0시간으로 추가한다. catalog_path(선택, 기본 public/catalog.json), inventory(테스트 전용). 예 {ok:true,count:2,items:[{sku:'G159be1f8',grade:'A',price:2990,units:['u-…']}]}
permission:
  network: [market.ourolabs.ai]
  write: [public/catalog.json, public/catalog.json.next, tmp/test/]
  identity: [shop]
  timeout: 30
logic: logic.py
test: test.py
version: 6
replaces: stock_and_price@5
