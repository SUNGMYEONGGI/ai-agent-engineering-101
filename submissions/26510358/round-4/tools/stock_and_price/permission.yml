name: stock_and_price
description: 실재고 SKU·등급별 unit과 유통기한을 catalog에 발행. args: prices [{sku,grade,price,warranty_hours}], catalog_path 선택; 테스트에서만 inventory 지정. 예: {count:2,items:[...]}
permission:
  network: [market.ourolabs.ai]
  write: [public/catalog.json, tmp/test/]
  identity: [shop]
  timeout: 30
logic: logic.py
test: test.py
version: 4
replaces: stock_and_price@3
