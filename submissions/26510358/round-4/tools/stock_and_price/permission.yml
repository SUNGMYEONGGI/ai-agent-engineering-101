name: stock_and_price
description: 실재고와 원장 거래 중간가로 만료순 카탈로그를 발행합니다. args: max_loss_per_day, loss_units, catalog_path, reserve_path; 테스트는 tmp/test만 사용합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/catalog.json, public/catalog.json.next, loss_reservations.json, loss_reservations.json.next, tmp/test/]
  identity: [shop]
  pay_limit: 0
  timeout: 35
logic: logic.py
test: test.py
version: 10
replaces: stock_and_price@9
