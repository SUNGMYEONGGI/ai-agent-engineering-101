name: a2a_handler
description: 실시간 inventory를 조회해 보유·미판매·미만료 단위만 선택하고 상품명·등급·가격이 답변과 checkout에 일치하는 결제서를 발급합니다. 부족 상품은 문의에서 추출해 wanted.jsonl에 기록하고 보유 대체품을 안내합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, customer_replies.jsonl, holds.json, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 35
replaces: a2a_handler@34
