name: market_call
description: 시장 API와 엔터티 카드를 호출한다. args: path, method, auth(none/shop/buyer), body(optional), url(optional). 인증 시 kit.token(role)을 Bearer로 사용하고 짧은 요약을 반환한다.
permission:
  network: [market.ourolabs.ai]
  write: [logs/react.jsonl]
  identity: [shop, buyer]
  pay_limit: 0
  timeout: 30
logic: logic.py
test: test.py
version: 4
replaces: market_call@3
