name: a2a_handler
description: 품목별 서명 결제서·정산, 누락 품목 기록, 중간가 이하 대안 및 실제 최종 응답 기록. 시험 경로 tmp/test/.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, customer_replies.jsonl, holds.json, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 13
replaces: a2a_handler@12
