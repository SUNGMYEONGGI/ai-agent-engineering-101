name: a2a_handler
description: 실재고·등급을 확인해 결제서를 발급하고 거절된 과거 품목을 재발급하지 않으며 대안을 안내합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, customer_replies.jsonl, holds.json, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 32
replaces: a2a_handler@31
