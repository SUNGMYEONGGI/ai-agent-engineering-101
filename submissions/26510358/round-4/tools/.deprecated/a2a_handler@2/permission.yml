name: a2a_handler
description: 예약 재고를 확인하고 한국어로 checkout_jwt를 발급하며 결제 mandate를 clearing에 정산하는 A2A 핸들러.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 2
replaces: a2a_handler@1
