name: a2a_handler
description: 실재고와 손절 승인을 검증해 결제·정산하며 누락 품목과 답변을 기록하고 대안을 안내합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, customer_replies.jsonl, holds.json, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 16
replaces: a2a_handler@15
