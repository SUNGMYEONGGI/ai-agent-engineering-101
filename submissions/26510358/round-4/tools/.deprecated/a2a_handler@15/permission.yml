name: a2a_handler
description: 실재고·승인 손절 가격 검증을 거쳐 결제서와 정산을 처리하고, 누락·응답을 기록하며 대안을 제시합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, customer_replies.jsonl, holds.json, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 15
replaces: a2a_handler@14
