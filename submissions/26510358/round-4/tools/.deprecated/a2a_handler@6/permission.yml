name: a2a_handler
description: 한국어 고객 문의를 처리하고 catalog와 reservations를 바탕으로 checkout_jwt를 발급하며, 구매자의 tx_hash와 fee_tx_hash를 clearing /api/settle에 전달하고 503이면 동일 요청을 재시도합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/catalog.json, public/reservations.jsonl, customers.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 6
replaces: a2a_handler@5
