name: a2a_handler
description: 품목별 서명 결제서·정산 및 누락 품목 기록과 중간가 이하 대안을 제공합니다. 시험 경로는 tmp/test/를 사용합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, holds.json, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 12
replaces: a2a_handler@11
