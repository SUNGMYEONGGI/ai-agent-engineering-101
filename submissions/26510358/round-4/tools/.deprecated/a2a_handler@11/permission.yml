name: a2a_handler
description: 고객 메시지의 품목별 구매 결제서 최대 3개와 예약·정산 처리를 수행합니다. 테스트에서 catalog_path, holds_path, customers_path, reservations_path를 tmp/test/로 지정하며 inventory_fixture를 사용할 수 있습니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, holds.json, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 11
replaces: a2a_handler@10
