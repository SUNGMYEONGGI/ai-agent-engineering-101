name: a2a_handler
description: 실재고·정산을 검증하고 요청 SKU를 정확히 일치시켜 실제 등급이 포함된 결제서를 발급합니다.
permission:
  network: [market.ourolabs.ai]
  write: [public/reservations.jsonl, customers.jsonl, customer_replies.jsonl, holds.json, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 28
replaces: a2a_handler@27
