name: a2a_handler
description: 실시간 재고와 카탈로그 가격으로 서명 결제서를 만들고 mandate를 정산하며 고객과 부족 품목을 기록합니다.
permission:
  network: [market.ourolabs.ai, 127.0.0.1]
  write: [holds.json, customers.jsonl, wanted.jsonl, tmp/test/]
  identity: [shop]
  wallet: [sign_jwt]
  timeout: 35
  handles: [a2a]
logic: logic.py
test: test.py
version: 36
replaces: a2a_handler@35
