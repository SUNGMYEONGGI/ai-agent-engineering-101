name: a2a_handler
description: 예약 또는 일반 재고 문의를 처리하고 한국어 checkout_jwt를 발급하며 구매자 mandate를 clearing에 정산하는 Round 4 A2A 핸들러.
permission:
  network: [market.ourolabs.ai, brooklyn-viewers-accounts-jackets.trycloudflare.com]
  write: [public/catalog.json, public/reservations.jsonl, customers.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 15
  handles: [a2a]
logic: logic.py
test: test.py
version: 5
replaces: a2a_handler@4
